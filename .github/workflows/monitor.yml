name: Athlon Flex monitor

# De cron is hier alleen nog de STARTMOTOR, niet de klok.
# GitHub start geplande runs onbetrouwbaar (gemeten: circa 12% van de
# geplande runs). Daarom checkt een run zelf ruim vijf uur lang door,
# elke INTERVAL_SECONDS. Zolang de cron een keer per vijf uur afgaat,
# is de dekking aaneengesloten.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Een tegelijk. Een nieuwe geplande run blijft wachten en start direct
# zodra de lopende run klaar is. Zo rijgen de runs zich aaneen.
concurrency:
  group: athlon-flex-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: pip install --quiet -r requirements.txt

      - name: Bewaak de showroom
        env:
          LOOP_MINUTES:     "320"   # circa 5u20m per run
          INTERVAL_SECONDS: "120"   # elke 2 minuten een check
          GIT_PERSIST:      "1"
          NTFY_TOPIC:          ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN:          ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECK_URL:     ${{ secrets.HEALTHCHECK_URL }}
          ATHLON_USERNAME:     ${{ secrets.ATHLON_USERNAME }}
          ATHLON_PASSWORD:     ${{ secrets.ATHLON_PASSWORD }}
          GROSS_YEARLY_INCOME: ${{ secrets.GROSS_YEARLY_INCOME }}
        run: python monitor.py
